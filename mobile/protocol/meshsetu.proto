syntax = "proto3";

package meshsetu.v1;
option java_package = "in.meshsetu.protocol";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

message MeshEnvelope {
  uint64 object_id = 1;
  string event_id = 2;
  string site_id = 3;
  string room_id = 4;
  int64 created_at_ms = 5;
  int64 expires_at_ms = 6;
  uint32 hop_count = 7;
  uint32 hop_limit = 8;
  Priority priority = 9;
  PayloadType payload_type = 10;
  bytes payload = 11;
  uint64 origin_ephemeral_id = 12;
  bytes trace_id = 13;
}

enum Priority {
  P_UNSPECIFIED = 0;
  P0_CRITICAL = 1;
  P1_HIGH = 2;
  P2_NORMAL = 3;
  P3_BULK = 4;
}

enum PayloadType {
  PT_UNSPECIFIED = 0;
  STRUCTURED_SOS = 1;
  ROOM_MESSAGE = 2;
  VOICE_MANIFEST = 3;
  VOICE_OBJECT = 4;
  ACK = 5;
  RESPONDER_UPDATE = 6;
  BEACON_OBSERVATION = 7;
  // Push-to-talk voice note authored inside a Room. Distinct from
  // VOICE_OBJECT, which is SOS evidence and is forwarded to the control
  // room; room voice stays inside the room's membership.
  ROOM_VOICE = 8;
}

enum ResponseType {
  RESPONSE_UNSPECIFIED = 0;
  SOS_RECEIVED = 1;
  HELP_DISPATCHED = 2;
  SAFETY_GUIDANCE = 3;
  INCIDENT_CLOSED = 4;
}

enum SignatureAlgorithm {
  SIG_UNSPECIFIED = 0;
  ECDSA_P256_SHA256 = 1;
}

message ResponderUpdateBody {
  string response_id = 1;
  string reply_to_event_id = 2;
  fixed64 destination_ephemeral_id = 3;
  ResponseType type = 4;
  string message_text = 5;
  int64 created_at_ms = 6;
  int64 expires_at_ms = 7;
  string site_id = 8;
  bytes original_trace_id = 9;
}

message SignedResponderUpdate {
  bytes body = 1;
  bytes authority_signature = 2;
  string authority_key_id = 3;
  SignatureAlgorithm algorithm = 4;
}

enum AckKind {
  ACK_KIND_UNSPECIFIED = 0;
  OBJECT_RECEIVED = 1;
  RESPONSE_DELIVERED = 2;
}

message AckMessage {
  string ack_id = 1;
  AckKind kind = 2;
  fixed64 acked_object_id = 3;
  string response_id = 4;
  string reply_to_event_id = 5;
  fixed64 sender_ephemeral_id = 6;
  int64 created_at_ms = 7;
  int64 expires_at_ms = 8;
}

